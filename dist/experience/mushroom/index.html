<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>菇毒患者</title><link rel="stylesheet" href="style.css?v=4"></head><body data-phase="choose">
<canvas id="world" aria-label="交互蘑菇点云"></canvas>
<header><a class="brand" href="#">菇毒患者<span>LET YOUR FEELINGS FLOW</span></a><div class="edition">情绪交互实验<br><span>召唤 / 倾诉 / 告别</span></div><button id="settings">感官设置</button><button id="fullscreen" title="全屏">↗ 全屏</button></header>
<main><div class="intro"><div class="eyebrow" id="stageLabel">01 / 看见你的情绪</div><h1 id="headline">今天，<br>你感觉如何？</h1><p id="description">选择一种此刻的情绪。<br>用手势召唤愿意倾听你的蘑菇。</p><button id="start" class="primary">开始体验 <span>↗</span></button><p class="privacy">摄像头与声音仅在本机实时处理</p><div id="status" role="status">正在读取真实点云…</div></div>
<aside id="settingsPanel"><div class="panel-title">感官输入 <i id="liveDot"></i></div><div class="camera"><video id="video" playsinline muted></video><canvas id="hand"></canvas><span id="cameraLabel">摄像头未开启</span></div><div class="device-row"><button id="cameraBtn">开启摄像头</button><button id="micBtn">开启麦克风</button></div><div class="readout"><span>声音强度 · 相对值</span><b id="level">00</b></div><div class="meter"><i id="meter"></i><em></em></div><div class="readout small"><span id="effect">静息 · 原生点云</span><span id="gesture">等待手势</span></div><details open><summary>声音设置</summary><label>模拟音量 <input id="simulate" type="range" min="0" max="1" step=".01" value="0"></label><label>麦克风灵敏度 <input id="gain" type="range" min="1" max="15" step=".1" value="5"></label><label>情绪释放阈值 <input id="threshold" type="range" min=".2" max=".85" step=".01" value=".48"></label><label>粒子大小 <input id="particleSize" type="range" min="1" max="4.5" step=".1" value="2.5"></label><label>酸性强度 <input id="acidStrength" type="range" min="0" max="1.5" step=".05" value="1"></label><label>点云精度 <select id="quality"><option value="4">流畅 · 12.5万点</option><option value="2">精细 · 25万点</option><option value="1" selected>完整 · 50万点</option></select></label><label>模型朝向 <select id="axis"><option value="y">Y 轴向上</option><option value="z">Z 轴向上</option><option value="x">X 轴向上</option></select></label><label class="check"><input id="rotate" type="checkbox" checked> 自动旋转</label><button id="reset">重置参数与视角</button></details></aside>
<section class="narration" aria-live="polite"><div id="narrationText">每一种情绪，都值得被听见。</div><div id="phaseHint">可做出手势，也可点击下方情绪卡召唤</div><div id="clearProgress" hidden><span id="progressText">已告别 0%</span><div><i id="progressFill"></i></div></div><button id="again" hidden>再听一次自己的声音 ↗</button></section><div class="specimen"><span id="specNo">SPECIMEN / 01</span><span id="points">500,000 SOURCE POINTS</span></div></main>
<footer><div class="selector" aria-label="选择情绪并召唤蘑菇"><button data-id="0" disabled><span>01</span><b>👍</b><div>焦虑<small>竖起大拇指</small></div></button><button data-id="1" disabled><span>02</span><b>✋</b><div>孤独<small>张开五指</small></div></button><button data-id="2" disabled><span>03</span><b>👎</b><div>沮丧<small>大拇指朝下</small></div></button><button data-id="3" disabled><span>04</span><b>✊</b><div>愤怒<small>收拢握拳</small></div></button></div><div class="footnote">菇毒患者 · 身体与情绪的交互实验<span>数字 1–4 召唤 · 无摄像头时，可用鼠标或触屏拨开情绪</span></div></footer>
<link rel="stylesheet" href="journey.css?v=4"><link rel="stylesheet" href="minimal-ui.css?v=1"><script type="module" src="app.js?v=4"></script></body></html>
